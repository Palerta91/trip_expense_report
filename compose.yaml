services:
  app:
    build: .
    command: pnpm start
    environment:
      DATABASE_URL: postgresql://trip:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/trip_expense
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ru-central-1
      S3_BUCKET: trip-expense-files
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      APP_URL: ${APP_URL:?set APP_URL}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      ENABLE_MINIMAX_RECOGNITION: ${ENABLE_MINIMAX_RECOGNITION:-false}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_API_BASE_URL: ${MINIMAX_API_BASE_URL:-https://api.minimax.io/v1}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    command: pnpm worker
    environment:
      DATABASE_URL: postgresql://trip:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/trip_expense
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ru-central-1
      S3_BUCKET: trip-expense-files
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      APP_URL: ${APP_URL:?set APP_URL}
      ENABLE_MINIMAX_RECOGNITION: ${ENABLE_MINIMAX_RECOGNITION:-false}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_API_BASE_URL: ${MINIMAX_API_BASE_URL:-https://api.minimax.io/v1}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    restart: unless-stopped

  migrate:
    build: .
    command: pnpm db:migrate
    environment:
      DATABASE_URL: postgresql://trip:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/trip_expense
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trip_expense
      POSTGRES_USER: trip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trip -d trip_expense"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
